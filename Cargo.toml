[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Luís Henrique"]

[workspace.dependencies]
voxel-hardware = { path = "crates/hardware" }
voxel-queue = { path = "crates/queue" }
voxel-models = { path = "crates/models" }
voxel-imaging = { path = "crates/imaging" }
voxel-logging = { path = "crates/logging" }
voxel-protocol = { path = "crates/protocol" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
