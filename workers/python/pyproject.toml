[project]
name = "voxel-worker"
version = "0.1.0"
description = "Worker Python do Voxel (modelos 3D e backend 2D alternativo)"
license = "MIT"
authors = [{ name = "Luís Henrique" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
