[project]
name = "voxel-worker"
version = "0.1.0"
description = "Worker Python do Voxel (modelos 3D e backend 2D alternativo)"
license = "MIT"
authors = [{ name = "Luís Henrique" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.156.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "httpx>=0.28",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.coverage.run]
source = ["voxel_worker"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle (avisos)
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "C4",  # comprehensions
    "PTH", # pathlib
    "PT",  # pytest
    "RUF", # regras do ruff
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "PIL",
    "PIL.*",
    "numpy",
    "numpy.*",
    "skimage",
    "skimage.*",
    "tsr",
    "tsr.*",
]
ignore_missing_imports = true
