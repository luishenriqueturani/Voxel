name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,tauri-driver

      - uses: oven-sh/setup-bun@v2

      - uses: astral-sh/setup-uv@v6

      - name: Dependências do projeto
        run: |
          (cd apps/desktop && bun install --frozen-lockfile)
          (cd workers/python && uv sync --locked)

      - name: Formatação
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Testes unitários com cobertura
        run: make coverage

      - name: Testes ponta a ponta
        run: xvfb-run --auto-servernum make e2e

      - name: Build
        run: make build
